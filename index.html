function rulesView(){return `<div class="guide-content"><div class="guide-intro"><span>01 / 观察 → 改造 → 交付 → 抵挡 → 构筑</span><h3>你的对手，是失衡的算力系统。</h3><p>把敌方的剩余工作量降到 0 即获胜；己方稳定性归零则征程结束。</p></div><div class="rule-grid"><div>${icon('bolt',26)}<h3>每回合 3 调度点</h3><p>卡牌左上角是消耗。每回合抽 5 张，未打出的牌会进入弃牌堆。抽牌堆耗尽会重新洗牌。</p></div><div>${icon('chip',26)}<h3>先找瓶颈，再打攻击</h3><p>技能改造系统，攻击完成任务。先量化、点亮光路或融合算子，会改变本回合攻击收益。</p></div><div>${icon('shield',26)}<h3>守住集群稳定性</h3><p>敌方头顶显示下回合意图。护盾先抵扣损伤，轮到你时清零；热量超过 60 会使芯片降频。</p></div><div>${icon('map',26)}<h3>一条路，十五次选择</h3><p>三章各五层。每场战后先做一题术语配对，再选牌；精英获遗物，营地修复或升级，交易所购牌或删牌。</p></div></div><div class="guide-callout"><strong>第一场试试这个组合</strong><p>芯火架构师：先用「算子融合」减少搬运，再用「张量斩」交付工作；若是显存瓶颈，优先「低比特量化」。最后给敌人的突发负载留一点护盾。</p></div><p class="modal-sub">键盘：1–9 出牌 · 空格结束回合 · Esc 关闭弹窗。卡牌“消耗”表示本场不再回抽；下一场仍保留。</p></div>`;}
function modelView(){const b=run?.stage==='battle'?run.b:null,m=b?E.model(run):null,p=b?PROFILES[b.enemy.profile]:null;
 return `<div class="guide-content"><div class="guide-intro"><span>THE SLOWEST STAGE SETS THE PACE</span><h3>算力不是一个数字，而是一组约束。</h3><p>同一任务，四个阶段的理想耗时取最大值：它就是当前的瓶颈。</p></div><div class="formula">t = max ( F / P, D<sub>HBM</sub> / B<sub>HBM</sub>, D<sub>NET</sub> / B<sub>NET</sub>, D<sub>SSD</sub> / B<sub>SSD</sub> )</div><div class="formula-notes"><span>F：任务计算量（TFLOP）</span><span>P：有效峰值（TFLOP/s）</span><span>D：读取或传输数据量</span><span>B：对应有效带宽</span></div>${m?`<div class="live-model"><h3>当前战场 · ${p.name}</h3><div class="model-grid">${Object.entries(m.times).map(([k,v])=>`<div class="${m.bottleneck===k?'active':''}"><small>${modelLabels[k]}</small><strong>${v.toFixed(3)} s</strong><span>${m.bottleneck===k?'当前瓶颈':'可重叠阶段'}</span></div>`).join('')}</div><p>${p.hint}</p><p>工作集 ${m.footprint.toFixed(1)} GB / 容量 ${m.memory} GB；单次教学能耗约 ${(m.energyKwh*1000).toFixed(2)} Wh（IT 功率上限 × 时间 × PUE 1.3；非实测账单）。供电预算 ${m.powerBudget.toFixed(2)} kW / 需求 ${m.requested.toFixed(2)} kW，教学占空比 ${Math.round(m.powerRatio*100)}%。</p></div>`:''}<div class="rule-grid"><div><h3>Roofline：搬得动，才算得快</h3><p>理想计算吞吐 ≤ min（峰值算力，HBM 带宽 × 算术强度）。网络与存储是模型额外加入的阶段约束。</p></div><div><h3>显存容量是硬门槛</h3><p>工作集超过显存时，攻击不可打出。量化降低权重占用；KV 缓存会减少搬运，也占用 8 GB 额外空间。</p></div><div><h3>热与供电约束</h3><p>热量是抽象负荷，非真实摄氏度。超过 60 后有效算力递减，最低保留 45%。每回合自然散热 15。</p></div><div><h3>现实规律，游戏映射</h3><p>执行量 = 基础值 × min（2.2，10 s / t）× 质量系数。量化每次将质量系数乘 0.94，仅作取舍教学。</p></div></div><div class="guide-callout"><strong>模型边界</strong><p>采用阶段理想重叠与峰值上界，供电不足按预算/需求折算运行占空比；未仿真内核、延迟、模型质量或真实云账单；实际阶段不完全重叠时会更慢。卡牌增幅、敌人、信用、热量和工作量均为游戏假设，不是硬件性能预测。</p></div></div>`;
}
function sourcesView(){return `<div class="guide-content"><div class="guide-intro"><span>VERIFIED 2026.10.26</span><h3>事实归事实，平衡归平衡。</h3><p>现实规格作为数量级与物理边界。把硬件翻译成卡牌时，所有额外增幅属于教学设定。</p></div><div class="source-list">${SOURCES.map((s,i)=>`<article><span>0${i+1}</span><div><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} ↗</a><p>${s.text}</p></div></article>`).join('')}</div><div class="guide-callout"><strong>教学假设单列</strong><p>SSD 有效读取 7 GB/s、400G 链路利用率 80%、PUE 1.3、任务 F/D/工作集、光路增幅和回合时长，均为本原型校准值。调度点不等于电量，热量不等于温度，信用不是美元。</p></div></div>`;}
function launch(){const previous=run?.learning;run=E.createRun(selected);try{const progress=previous||JSON.parse(localStorage.getItem('compute-spire.learning.v2')||'null');if(progress?.seen&&progress?.answers&&Number.isFinite(progress.total)&&Number.isFinite(progress.correct)){const copy=structuredClone(run);copy.learning=structuredClone(progress);if(E.validateRun(copy))run.learning=copy.learning;}}catch{}screen='run';modal=null;tone();commit();}
function doPlay(id){const x=run?.b?.hand.find(c=>c.uid===Number(id));if(!x||run.stage!=='battle')return;const allowed=E.canPlay(run,x);if(!allowed.ok){notify(allowed.reason);return;}const c=card(x.id,x.up),preview=c.base?E.projected(run,x):null;if(E.playCard(run,x.uid)){tone(c.base?'attack':'card');const currentFlash={text:preview?(preview.delivered?`完成 ${preview.delivered} 工作量`:`屏障吸收 ${preview.blocked}`):c.name,kind:c.base?'attack':'skill'};flash=currentFlash;commit();setTimeout(()=>{if(flash===currentFlash){flash=null;render();}},650);}}
app.addEventListener('click',ev=>{
 const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;
 const {action,id}=el.dataset;
 if(action==='backdrop'){if(ev.target===el){modal=null;render();}return;}
 if(action==='close'){modal=null;render();return;}
 if(action==='hero'){selected=id;render();return;}
 if(action==='start'){if(run&&!['victory','defeat'].includes(run.stage)){modal='new-run';render();}else launch();return;}
 if(action==='confirm-start'){launch();return;}
 if(action==='continue'){screen='run';render();return;}
 if(action==='home'||action==='return-lobby'){screen='lobby';modal=null;render();return;}
 if(action==='learning'){modal='learning';render();return;}
 if(action==='library'){modal='library';filter='all';render();return;}
 if(action==='filter'){filter=id;render();return;}
 if(action==='guide'||action==='physics'){modal=action;tab=action==='physics'?'model':'rules';render();return;}
 if(action==='guide-tab'){tab=id;render();return;}
 if(action==='settings'){modal='settings';render();return;}
 if(action==='sound'){sound=!sound;tone();render();return;}
 if(action==='export'){
  if(!run)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([E.serialize(run)],{type:'application/json'}));a.download=`compute-spire-${run.hero}-F${run.floor+1}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);notify('已发起存档下载，请在浏览器下载记录中查看。');return;
 }
 if(action==='confirm-import'&&imported){run=imported;imported=null;screen='run';modal=null;commit();notify('征程已导入并保存。');return;}
 if(action==='card-detail'){
  let x=run?.deck.find(c=>String(c.uid)===id)||run?.b?.discard.find(c=>String(c.uid)===id)||{id,up:false};if(!CARDS[x.id])return;tab=x;modal='card';render();return;
 }
 if(!run)return;
 if(action==='map'){if(run.stage==='map'&&screen==='run'){notify('选择亮起的节点即可前进。');}else {modal='map';render();}return;}
 if(['deck','draw','discard'].includes(action)){modal=action;render();return;}
 if(action==='relic'){modal='relic';tab=id;render();return;}
 if(action==='logs'){modal='logs';render();return;}
 if(action==='node'){if(E.enterNode(run,Number(id))){tone();commit();}return;}
 if(action==='play'){doPlay(id);return;}
 if(action==='end-turn'){if(E.endTurn(run)){tone('attack');commit();}return;}
 if(action==='quiz-answer'||action==='quiz-reveal'){if(E.answerQuiz(run,action==='quiz-reveal'?-1:Number(id))){tone();commit();}return;}
 if(action==='quiz-next'){if(E.continueQuiz(run))commit();return;}
 if(action==='chain'){tab=run.b.chainLog[0]?.card||'rubin';modal='card';render();return;}
 if(action==='reward-card'||action==='skip-reward'){if(E.chooseReward(run,action==='reward-card'?Number(id):null)){tone('win');commit();}return;}
 if(action==='rest'){if(E.rest(run)){tone();commit();}return;}
 if(action==='open-upgrade'){modal='upgrade';render();return;}
 if(action==='upgrade-card'){if(E.upgrade(run,Number(id))){modal=null;commit();notify('卡牌已永久升级。');}return;}
 if(action==='buy-card'){if(E.buy(run,Number(id))){tone();commit();}return;}
 if(action==='buy-relic'){if(E.buyRelic(run)){tone();commit();}return;}
 if(action==='open-remove'){modal='remove';render();return;}
 if(action==='remove-card'){if(E.removeCard(run,Number(id))){modal=null;commit();notify('卡牌已移出牌组。');}return;}
 if(action==='leave'){E.leaveNode(run);commit();return;}
 if(action==='event'){if(E.chooseEvent(run,Number(id))){tone();commit();}return;}
});
app.addEventListener('change',async ev=>{
 if(ev.target.id!=='import-file')return;const file=ev.target.files[0];if(!file)return;
 try{if(file.size>600000)throw new Error('文件过大');imported=E.deserialize(await file.text());modal='import-preview';render();}catch(err){notify('导入失败：'+err.message+'。当前征程未改变。');}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&modal){modal=null;render();return;}
 if(modal&&ev.key==='Tab'){
  const focusables=[...document.querySelectorAll('.modal button:not(:disabled),.modal a,.modal input')],first=focusables[0],last=focusables.at(-1);if(ev.shiftKey&&(document.activeElement===first||document.activeElement===document.querySelector('.modal'))){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}return;
 }
 if(modal||screen!=='run'||run?.stage!=='battle'||ev.repeat||['INPUT','TEXTAREA'].includes(ev.target.tagName))return;
 if(/^[1-9]$/.test(ev.key)){ev.preventDefault();doPlay(run.b.hand[Number(ev.key)-1]?.uid);}
 if(ev.code==='Space'&&ev.target.tagName!=='BUTTON'){ev.preventDefault();if(E.endTurn(run))commit();}
});
render();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1')&&!document.querySelector('script[src]'))navigator.serviceWorker.register(new URL('./service-worker.js',location.href)).then(()=>navigator.serviceWorker.ready).then(()=>{document.documentElement.dataset.offlineReady='true';if(modal==='settings')render();}).catch(()=>{});
</script></body></html>
